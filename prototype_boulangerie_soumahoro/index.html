function openNotifications(){showDrawer(`<div class="drawer-head"><div><div class="section-title">Notifications</div><div class="subhead">3 alertes opérationnelles</div></div><button class="icon-btn" onclick="closeOverlays()">${icon('x',16)}</button></div><div class="drawer-body"><div class="filters"><button class="btn sm primary">Toutes</button><button class="btn sm">Non lues</button><button class="btn sm">Critiques</button></div><div class="alert critical">${icon('triangle-alert',17)}<div><strong>Stock critique</strong><p>Levure — 7 paquets · Cocody · il y a 5 min</p></div></div><div class="alert warning">${icon('shopping-cart',17)}<div><strong>Commande reçue</strong><p>Fournisseur ABC · il y a 32 min</p></div></div><div class="alert info">${icon('factory',17)}<div><strong>Production validée</strong><p>1 482 pains · il y a 1 h</p></div></div></div>`)}
function openSiteDrawer(){showDrawer(`<div class="drawer-head"><div><div class="section-title">Changer de boulangerie</div><div class="subhead">Le contexte reste visible sur chaque écran</div></div><button class="icon-btn" onclick="closeOverlays()">${icon('x',16)}</button></div><div class="drawer-body">${state.sites.map(s=>`<button class="site-switch" style="width:100%;margin-bottom:8px" onclick="switchSite('${s.id}')">${icon('store',16)}<span style="flex:1"><strong>${s.name}</strong><small>${s.meta}</small></span>${state.site===s.id?icon('check',16):''}</button>`).join('')}</div>`)}
function switchSite(id){state.site=id;const s=state.sites.find(x=>x.id===id);document.getElementById('siteName').textContent=s.name;document.getElementById('siteMeta').textContent=s.meta;closeOverlays();toast('Contexte changé',`Vous consultez maintenant ${s.name}.`);render()}
function openSearch(){document.getElementById('overlay').classList.add('open');document.getElementById('searchPanel').classList.add('open');document.getElementById('globalSearch').focus();renderSearchResults('')}
function renderSearchResults(q){const items=[['Pain — produit fini','Produit · Stock 1 285','inventory'],['PROD-2026-0042','Production · 1 482 pains','production'],['Grossiste X','Client grossiste · 186 400 pains/an','wholesalers'],['Fournisseur ABC','Fournisseur · 2 commandes','purchasing'],['Farine 50 kg','Stock · 24 sacs','inventory'],['Mariam Touré','Employée · Responsable Vente','employees']];const f=items.filter(x=>(x[0]+x[1]).toLowerCase().includes(q.toLowerCase()));document.getElementById('searchResults').innerHTML=f.map(x=>`<div class="result" onclick="closeOverlays();go('${x[2]}')">${icon('search',15)}<div><strong style="font-size:12px">${x[0]}</strong><small>${x[1]}</small></div></div>`).join('')||`<div style="padding:24px;text-align:center;color:var(--muted);font-size:12px">Aucun résultat. Essayez un produit, fournisseur, grossiste ou référence.</div>`}
function showDrawer(content){document.getElementById('drawerContent').innerHTML=content;document.getElementById('overlay').classList.add('open');document.getElementById('drawer').classList.add('open');lucide.createIcons()}
function showModal(content){document.getElementById('modalContent').innerHTML=content;document.getElementById('overlay').classList.add('open');document.getElementById('modal').classList.add('open');lucide.createIcons()}
function closeOverlays(){document.getElementById('overlay').classList.remove('open');document.getElementById('drawer').classList.remove('open');document.getElementById('modal').classList.remove('open');document.getElementById('searchPanel').classList.remove('open')}
function toast(title,msg){const root=document.getElementById('toastRoot');const el=document.createElement('div');el.className='toast';el.innerHTML=`${icon('circle-check',18)}<div><strong>${title}</strong><p>${msg}</p></div>`;root.appendChild(el);lucide.createIcons();setTimeout(()=>el.remove(),4000)}
function toggleSidebar(){document.getElementById('sidebar').classList.toggle('open')}
function setRole(r){state.role=r;state.page='dashboard';const roleName={admin:'Super-Admin',production:'Responsable Production',sales:'Responsable Vente'}[r];toast('Rôle simulé',`Interface chargée pour ${roleName}.`);render()}
function createOrder(){closeOverlays();openOrder('Levure')}
function openOrder(prefill=''){showModal(`<div class="modal-head"><div><div class="section-title">Nouvelle commande</div><div class="subhead">Commande d'approvisionnement</div></div><button class="icon-btn" onclick="closeOverlays()">${icon('x',16)}</button></div><div class="modal-body"><div class="form-grid"><div class="field"><label>Fournisseur</label><select class="select"><option>Fournisseur ABC</option><option>Matières CI</option></select></div><div class="field"><label>Site</label><select class="select"><option>Boulangerie Cocody</option><option>Boulangerie Yopougon</option></select></div><div class="field"><label>Produit</label><select class="select"><option>${prefill||'Farine 50 kg'}</option><option>Levure</option><option>Améliorant</option><option>Sel</option></select></div><div class="field"><label>Quantité</label><input class="input" type="number" value="${prefill==='Levure'?20:20}"></div><div class="field"><label>Prix unitaire</label><input class="input" value="34000 FCFA"></div><div class="field"><label>Statut</label><select class="select"><option>En attente</option><option>Commandée</option></select></div></div><div class="callout" style="margin-top:16px">La commande n'augmente le stock qu'après réception contrôlée et validation.</div></div><div class="modal-foot"><button class="btn" onclick="closeOverlays()">Annuler</button><button class="btn primary" onclick="closeOverlays();toast('Commande créée','CMD-2026-0082 est en attente de livraison.');render()">Créer la commande</button></div>`)}
function openOrderDetail(id){const o=state.orders.find(x=>x.id===id);showDrawer(`<div class="drawer-head"><div><div class="section-title">${o.id}</div><div class="subhead">${o.supplier} · ${o.site}</div></div><button class="icon-btn" onclick="closeOverlays()">${icon('x',16)}</button></div><div class="drawer-body"><div>${status(o.status)}</div><div style="height:14px"></div><div class="impact"><div class="impact-row"><span>Total</span><strong>${money(o.total)}</strong></div><div class="impact-row"><span>Date</span><strong>${o.date}</strong></div></div><h3 style="font-size:13px;margin-top:22px">Lignes</h3><div class="callout">${o.lines}</div><div style="height:16px"></div>${o.status==='Livrée'?`<button class="btn primary" onclick="validateReceipt('${id}')">${icon('check',14)}Valider la réception</button>`:`<button class="btn" onclick="toast('Réception','Aucune réception disponible pour cette commande.')">Enregistrer une réception</button>`}</div>`)}
function validateReceipt(id){const o=state.orders.find(x=>x.id===id);o.status='Validée';closeOverlays();toast('Réception validée','Les quantités reçues ont été intégrées au stock.');render()}
function openStock(name){const s=state.stocks.find(x=>x.name===name);showDrawer(`<div class="drawer-head"><div><div class="section-title">${s.name}</div><div class="subhead">${s.cat}</div></div><button class="icon-btn" onclick="closeOverlays()">${icon('x',16)}</button></div><div class="drawer-body"><div class="grid g2"><div class="card"><div class="kpi-label">STOCK</div><div class="kpi-value">${new Intl.NumberFormat('fr-FR').format(s.qty)}</div><div class="muted">${s.unit}</div></div><div class="card"><div class="kpi-label">SEUIL</div><div class="kpi-value">${new Intl.NumberFormat('fr-FR').format(s.threshold)}</div><div>${status(s.status==='danger'?'Critique':s.status==='warning'?'Faible':'Disponible')}</div></div></div><h3 style="font-size:13px;margin-top:22px">Historique récent</h3><div class="timeline"><div class="tl"><div class="rail"><div class="dot2"></div></div><div class="tl-content"><strong>Consommation production</strong><p>-5 · PROD-2026-0042 · 05:42</p></div></div><div class="tl"><div class="rail"><div class="dot2"></div></div><div class="tl-content"><strong>Réception fournisseur</strong><p>+25 · REC-2026-0038 · hier</p></div></div></div>${s.status==='danger'?'<button class="btn primary" onclick="createOrder()">Créer une commande</button>':''}</div>`)}
function openProductionDetail(id){const p=state.productions.find(x=>x.id===id);showDrawer(`<div class="drawer-head"><div><div class="section-title">${p.id}</div><div class="subhead">${p.product} · ${p.date}</div></div><button class="icon-btn" onclick="closeOverlays()">${icon('x',16)}</button></div><div class="drawer-body"><div>${status(p.status)}</div><div style="height:14px"></div><div class="grid g2"><div class="card"><div class="kpi-label">THÉORIQUE</div><div class="kpi-value">${p.theory}</div></div><div class="card"><div class="kpi-label">RÉEL</div><div class="kpi-value">${p.real}</div></div></div><div class="callout" style="margin-top:14px">Écart : <strong>${p.variance} pains</strong> · motif : problème de production</div><h3 style="font-size:13px;margin-top:22px">Impact stock</h3><div class="impact"><div class="impact-row"><span>Farine</span><strong>-5 sacs</strong></div><div class="impact-row"><span>Améliorant</span><strong>-5 paquets</strong></div><div class="impact-row"><span>Levure</span><strong>-5 paquets</strong></div><div class="impact-row"><span>Produit fini</span><strong>+${p.real} pains</strong></div></div></div>`)}
function openLot(id){const l=state.lots.find(x=>x.id===id);showDrawer(`<div class="drawer-head"><div><div class="section-title">${l.id}</div><div class="subhead">${l.product}</div></div><button class="icon-btn" onclick="closeOverlays()">${icon('x',16)}</button></div><div class="drawer-body"><div>${status(l.status)}</div><div class="grid g2" style="margin-top:14px"><div class="card"><div class="kpi-label">PRODUIT</div><div class="kpi-value" style="font-size:22px">${l.initial}</div><div class="muted">unités initiales</div></div><div class="card"><div class="kpi-label">RESTANT</div><div class="kpi-value" style="font-size:22px">${l.left}</div><div class="muted">à écouler</div></div></div><div class="impact" style="margin-top:14px"><div class="impact-row"><span>Production</span><strong>30/09/2026 05:42</strong></div><div class="impact-row"><span>Vendu</span><strong>${l.sold}</strong></div><div class="impact-row"><span>Perdu</span><strong>${l.loss}</strong></div><div class="impact-row"><span>Date limite</span><strong>${l.expiry}</strong></div></div></div>`)}
function openWholesalerDetail(id){const w=state.wholesalers.find(x=>x.id===id);showDrawer(`<div class="drawer-head"><div><div class="section-title">${w.name}</div><div class="subhead">${w.contact} · ${w.zone}</div></div><button class="icon-btn" onclick="closeOverlays()">${icon('x',16)}</button></div><div class="drawer-body"><div>${status('Actif')}</div><div style="height:14px"></div><div class="grid g2"><div class="card"><div class="kpi-label">QUANTITÉ ANNUELLE</div><div class="kpi-value" style="font-size:22px">${new Intl.NumberFormat('fr-FR').format(w.annual)}</div></div><div class="card"><div class="kpi-label">CA ANNUEL</div><div class="kpi-value" style="font-size:22px">${(w.revenue/1000000).toFixed(1)} M</div></div></div><div class="tabs" style="margin-top:18px"><button class="tab active">Vue d'ensemble</button><button class="tab">Ventes</button><button class="tab">Ristournes</button><button class="tab">Paiements</button></div><div class="callout">Commande habituelle : Pain <strong>${w.daily}/jour</strong>. Ristourne configurée : <strong>${w.rebate}</strong>.</div><div style="margin-top:15px"><button class="btn primary" onclick="closeOverlays();openSale('${w.id}')">Créer une vente</button></div></div>`)}
function openWholesaler(){showModal(`<div class="modal-head"><div><div class="section-title">Nouveau grossiste</div></div><button class="icon-btn" onclick="closeOverlays()">${icon('x',16)}</button></div><div class="modal-body"><div class="form-grid"><div class="field"><label>Nom / raison sociale</label><input class="input" placeholder="Grossiste"></div><div class="field"><label>Personne responsable</label><input class="input"></div><div class="field"><label>Téléphone</label><input class="input"></div><div class="field"><label>Zone</label><input class="input"></div><div class="field"><label>Prix applicable</label><select class="select"><option>Prix grossiste</option><option>Prix configuré</option></select></div><div class="field"><label>Quantité habituelle / jour</label><input class="input" type="number" value="300"></div></div></div><div class="modal-foot"><button class="btn" onclick="closeOverlays()">Annuler</button><button class="btn primary" onclick="closeOverlays();toast('Grossiste créé','La fiche grossiste est disponible.')">Créer</button></div>`)}
function openAdjustment(){showModal(`<div class="modal-head"><div><div class="section-title">Nouvel ajustement de stock</div><div class="subhead">Toute correction reste auditée</div></div><button class="icon-btn" onclick="closeOverlays()">${icon('x',16)}</button></div><div class="modal-body"><div class="form-grid"><div class="field"><label>Produit</label><select class="select"><option>Farine 50 kg</option><option>Levure</option></select></div><div class="field"><label>Type</label><select class="select"><option>Ajustement positif</option><option>Ajustement négatif</option><option>Correction administrative</option></select></div><div class="field"><label>Quantité</label><input class="input" type="number" value="1"></div><div class="field"><label>Unité</label><input class="input" value="sac"></div><div class="field full"><label>Motif obligatoire</label><textarea class="textarea" placeholder="Pourquoi cet ajustement ?"></textarea></div></div><div class="alert warning" style="margin-top:14px">${icon('shield-alert',16)}<div><strong>Opération auditable</strong><p>La correction ne supprime pas l'historique : elle crée un mouvement compensatoire.</p></div></div></div><div class="modal-foot"><button class="btn" onclick="closeOverlays()">Annuler</button><button class="btn primary" onclick="closeOverlays();toast('Ajustement enregistré','Le mouvement de stock a été journalisé.')">Enregistrer</button></div>`)}
function openEmployee(){showModal(`<div class="modal-head"><div><div class="section-title">Nouvel employé</div></div><button class="icon-btn" onclick="closeOverlays()">${icon('x',16)}</button></div><div class="modal-body"><div class="form-grid"><div class="field"><label>Nom</label><input class="input"></div><div class="field"><label>Prénom</label><input class="input"></div><div class="field"><label>Téléphone</label><input class="input"></div><div class="field"><label>Poste</label><select class="select"><option>Responsable Production</option><option>Responsable Vente</option><option>Manœuvre</option><option>Caissier</option><option>Chauffeur</option><option>Autre</option></select></div><div class="field"><label>Site</label><select class="select"><option>Cocody</option><option>Yopougon</option><option>Bouaké</option></select></div><div class="field"><label>Salaire de base</label><input class="input" value="200000 FCFA"></div><div class="field"><label>Type de contrat</label><select class="select"><option>CDI</option><option>CDD</option><option>Autre</option></select></div><div class="field"><label>Date d'embauche</label><input class="input" type="date"></div></div></div><div class="modal-foot"><button class="btn" onclick="closeOverlays()">Annuler</button><button class="btn primary" onclick="closeOverlays();toast('Employé créé','La fiche employé a été enregistrée.')">Créer</button></div>`)}
function openExpense(){showModal(`<div class="modal-head"><div><div class="section-title">Nouvelle charge</div></div><button class="icon-btn" onclick="closeOverlays()">${icon('x',16)}</button></div><div class="modal-body"><div class="form-grid"><div class="field"><label>Catégorie</label><select class="select"><option>Électricité</option><option>Eau</option><option>Imprévus</option><option>Maintenance</option><option>Transport</option><option>Autre</option></select></div><div class="field"><label>Montant</label><input class="input" value="0 FCFA"></div><div class="field"><label>Site</label><select class="select"><option>Cocody</option><option>Yopougon</option><option>Bouaké</option></select></div><div class="field"><label>Bénéficiaire / fournisseur</label><input class="input"></div><div class="field"><label>Moyen de paiement</label><select class="select"><option>Virement</option><option>Espèces</option><option>Mobile Money</option></select></div><div class="field"><label>Date</label><input class="input" type="date" value="2026-09-30"></div><div class="field full"><label>Commentaire</label><textarea class="textarea"></textarea></div></div></div><div class="modal-foot"><button class="btn" onclick="closeOverlays()">Annuler</button><button class="btn primary" onclick="closeOverlays();toast('Charge enregistrée','La dépense a été rattachée au site sélectionné.')">Enregistrer</button></div>`)}
function openPayroll(){toast('Module paie','Le prototype simule la préparation et la validation de paie.')}
function openExport(){showModal(`<div class="modal-head"><div><div class="section-title">Exporter un rapport</div><div class="subhead">Les exports suivent les filtres actifs</div></div><button class="icon-btn" onclick="closeOverlays()">${icon('x',16)}</button></div><div class="modal-body"><div class="form-grid"><div class="field"><label>Format</label><select class="select"><option>Excel (.xlsx)</option><option>PDF</option><option>CSV</option></select></div><div class="field"><label>Périmètre</label><select class="select"><option>Vue actuelle</option><option>Rapport complet</option></select></div></div></div><div class="modal-foot"><button class="btn" onclick="closeOverlays()">Annuler</button><button class="btn primary" onclick="closeOverlays();toast('Export préparé','Le fichier est prêt à être généré par l’application Laravel.')">Préparer l’export</button></div>`)}
function openSiteCreate(){showModal(`<div class="modal-head"><div><div class="section-title">Nouvelle boulangerie</div></div><button class="icon-btn" onclick="closeOverlays()">${icon('x',16)}</button></div><div class="modal-body"><div class="form-grid"><div class="field"><label>Nom</label><input class="input" placeholder="Boulangerie ..."></div><div class="field"><label>Code</label><input class="input" placeholder="BKG-004"></div><div class="field"><label>Adresse</label><input class="input"></div><div class="field"><label>Téléphone</label><input class="input"></div><div class="field"><label>Responsable</label><input class="input"></div><div class="field"><label>Statut</label><select class="select"><option>Active</option><option>Inactive</option></select></div></div></div><div class="modal-foot"><button class="btn" onclick="closeOverlays()">Annuler</button><button class="btn primary" onclick="closeOverlays();toast('Boulangerie créée','Le nouveau site peut maintenant recevoir ses paramètres et son stock.')">Créer</button></div>`)}
function openTransfer(){showModal(`<div class="modal-head"><div><div class="section-title">Transfert inter-sites</div><div class="subhead">Sortie du site A + entrée du site B</div></div><button class="icon-btn" onclick="closeOverlays()">${icon('x',16)}</button></div><div class="modal-body"><div class="form-grid"><div class="field"><label>Site départ</label><select class="select"><option>Cocody</option><option>Bouaké</option></select></div><div class="field"><label>Site arrivée</label><select class="select"><option>Yopougon</option><option>Cocody</option></select></div><div class="field"><label>Produit</label><select class="select"><option>Farine 50 kg</option><option>Levure</option></select></div><div class="field"><label>Quantité</label><input class="input" type="number" value="10"></div><div class="field full"><label>Motif</label><textarea class="textarea"></textarea></div></div></div><div class="modal-foot"><button class="btn" onclick="closeOverlays()">Annuler</button><button class="btn primary" onclick="closeOverlays();toast('Transfert créé','La sortie et l’entrée inter-sites seront journalisées.')">Créer le transfert</button></div>`)}
function openUser(){toast('Création utilisateur','Le prototype ouvre ici le formulaire utilisateur + affectation site + rôle.')}
function openPermissions(){toast('Permissions','Les permissions critiques sont distinctes et contrôlées côté serveur.')}
document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();openSearch()}if(e.key==='Escape')closeOverlays()});
document.getElementById('siteName').textContent=state.sites[0].name;document.getElementById('siteMeta').textContent=state.sites[0].meta;
render();
</script>
</body>
